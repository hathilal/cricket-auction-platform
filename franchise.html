<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>BOUNDARY — My Franchise</title><link rel="stylesheet" href="./workspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="./workspace-data.js"><\/script></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="./index.html"><span class="brand-mark">B</span><span>BOUNDARY<span class="brand-dot">.</span></span></a><div class="nav-label">WORKSPACE</div><a class="nav-link " href="./overview.html"><span class="ico">◈</span>Overview</a><a class="nav-link " href="./multiplayer-auction.html"><span class="ico">⌂</span>Auction Lobby</a><a class="nav-link " href="./auction-floor.html"><span class="ico">◉</span>Live Auction</a><a class="nav-link " href="./players.html"><span class="ico">♙</span>Player Hub</a><div class="nav-label">FRONT OFFICE</div><a class="nav-link active" href="./franchise.html"><span class="ico">♜</span>My Franchise</a><a class="nav-link " href="./analytics.html"><span class="ico">▥</span>Auction Analytics</a><a class="nav-link " href="./live-centre.html"><span class="ico">◎</span>Live Centre</a><div class="nav-label">PREFERENCES</div><a class="nav-link " href="./settings.html"><span class="ico">⚙</span>Settings</a><div class="sidebar-bottom"><b>BOUNDARY ARENA</b>Independent cricket auction experience<br>Preview workspace · v0.2</div></aside><section class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div class="crumb">BOUNDARY <span style="color:#52647e">/</span> <b>MY FRANCHISE</b></div></div><div class="top-actions"><span class="online"><i></i> WORKSPACE READY</span><div class="avatar">B</div></div></header><main class="content"><div class="panel" id="liveWorkspacePanel" style="margin:0 0 18px"><div class="panel-head"><div><h2>Live franchise intelligence</h2><p>Pulled from the active room. Your personal squad appears when you have a franchise seat.</p></div><span class="status-pill gold" id="liveConnectionStatus">CHECKING CONNECTION</span></div><div id="liveWorkspace" class="empty-note">Loading room data…</div><div style="padding:0 21px 17px;color:var(--muted);font-size:9px" id="liveConnectionHelp"></div></div><div class="page-head"><div><div class="eyebrow">THE FRONT OFFICE / MY FRANCHISE</div><h1>My Franchise</h1><p>A dedicated front office for squad building, purse discipline and role balance.</p></div></div><div class="grid stats"><article class="stat-card"><div class="stat-top">AVAILABLE PURSE <span class="stat-icon">₹</span></div><div class="stat-value">100 Cr</div><div class="stat-note">Demo opening balance</div></article><article class="stat-card"><div class="stat-top">SQUAD SIZE <span class="stat-icon">♜</span></div><div class="stat-value">0 / 18</div><div class="stat-note">No players signed yet</div></article><article class="stat-card"><div class="stat-top">AVERAGE PRICE <span class="stat-icon">↗</span></div><div class="stat-value">—</div><div class="stat-note">Appears after purchases</div></article><article class="stat-card"><div class="stat-top">SQUAD COMPLETION <span class="stat-icon">◌</span></div><div class="stat-value">0%</div><div class="progress" style="margin-top:10px"><span style="width:0%"></span></div></article></div><div class="grid split"><section class="panel"><div class="panel-head"><div><h2>Squad composition</h2><p>Build a balanced XI across specialist roles</p></div><span class="status-pill gold">SQUAD BUILDER</span></div><div class="bars"><div class="bar-row"><span>Batters</span><div class="bar"><span style="width:0%"></span></div><b>0 / 6</b></div><div class="bar-row"><span>All-rounders</span><div class="bar"><span style="width:0%"></span></div><b>0 / 4</b></div><div class="bar-row"><span>Wicketkeepers</span><div class="bar"><span style="width:0%"></span></div><b>0 / 2</b></div><div class="bar-row"><span>Bowlers</span><div class="bar"><span style="width:0%"></span></div><b>0 / 6</b></div></div><div class="empty-note" style="margin-top:22px">Your squad will populate here as players are sold to your franchise in an auction.</div></section><section class="panel"><div class="panel-head"><div><h2>Franchise strategy</h2><p>Quick access to the tools you need</p></div></div><div class="activity"><a class="activity-row" href="./players.html"><div>Scout the player pool<small>Review available talent and roles</small></div><span class="activity-amount">↗</span></a><a class="activity-row" href="./auction-floor.html"><div>Enter the auction floor<small>Bid for players in the demo room</small></div><span class="activity-amount">↗</span></a><a class="activity-row" href="./analytics.html"><div>Review auction intelligence<small>Understand spend and value</small></div><span class="activity-amount">↗</span></a></div></section></div></main></section></div><script>
document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refreshLive(r){const m=await c.client.from('auction_members').select('franchise_id,member_role,display_name').eq('room_id',r.room_id).eq('user_id',c.session.user.id).maybeSingle();if(m.error)throw m.error;const f=r.franchises.find(x=>x.id===m.data?.franchise_id);const sold=r.lots.filter(x=>x.status==='sold'&&x.leading_franchise_id===f?.id);const spend=sold.reduce((a,x)=>a+Number(x.current_price),0);const roles={Batter:0,Bowler:0,'All-rounder':0,Wicketkeeper:0};sold.forEach(x=>{const k=Object.keys(roles).find(k=>x.player_role.toLowerCase().includes(k.toLowerCase()));if(k)roles[k]++});const root=document.getElementById('liveWorkspace');root.innerHTML=f?'<div class="grid stats" style="margin:0"><article class="stat-card"><div class="stat-top">FRANCHISE</div><div class="stat-value" style="font-size:19px">'+esc(f.name)+'</div><div class="stat-note">Seat '+f.seat_no+'</div></article><article class="stat-card"><div class="stat-top">AVAILABLE PURSE</div><div class="stat-value">₹'+Number(f.purse).toFixed(2)+' Cr</div><div class="stat-note">Starting purse ₹'+Number(r.starting_purse).toFixed(2)+' Cr</div></article><article class="stat-card"><div class="stat-top">PLAYERS SIGNED</div><div class="stat-value">'+sold.length+' / '+r.squad_limit+'</div><div class="stat-note">Completed transactions</div></article><article class="stat-card"><div class="stat-top">TOTAL SPEND</div><div class="stat-value">₹'+spend.toFixed(2)+' Cr</div><div class="stat-note">Average ₹'+(sold.length?spend/sold.length:0).toFixed(2)+' Cr per player</div></article></div><div class="panel" style="margin-top:15px"><div class="panel-head"><div><h2>Signed squad</h2><p>Confirmed sold lots for '+esc(f.name)+'</p></div><span class="status-pill positive">'+sold.length+' SIGNINGS</span></div>'+(sold.length?'<div class="activity">'+sold.map(x=>'<div class="activity-row"><div>'+esc(x.player_name)+'<small>'+esc(x.player_role)+' · Lot '+x.lot_no+'</small></div><span class="activity-amount">₹'+Number(x.current_price).toFixed(2)+' Cr</span></div>').join('')+'</div>':'<div class="empty-note">No completed signings for this franchise yet.</div>')+'</div>':'<div class="empty-note">You are connected to '+esc(r.room_name)+', but this account does not hold a franchise seat. Join an open seat from Auction Lobby to see your personal squad and purse.</div>';}
(async()=>{const badge=document.getElementById('liveConnectionStatus'),box=document.getElementById('liveWorkspace'),help=document.getElementById('liveConnectionHelp');try{const c=await window.BoundaryData.connect();if(!c.ok){badge.textContent='NOT CONNECTED';box.textContent=c.reason;help.innerHTML='Open <a href="./multiplayer-auction.html">Auction Lobby</a> to connect and create or join a room.';return}await refreshLive(c.room);badge.textContent='LIVE ROOM DATA';badge.className='status-pill positive';help.textContent='Room '+c.room.room_code+' · updates automatically when room records change.';await window.BoundaryData.watch(c,async r=>{await refreshLive(r);badge.textContent='LIVE ROOM DATA'})}catch(e){badge.textContent='CONNECTION ERROR';badge.className='status-pill gold';box.textContent=e.message||'Could not load room data.';help.innerHTML='Check your guest session, room membership and Supabase configuration in <a href="./multiplayer-auction.html">Auction Lobby</a>.'}})();
</script></body></html>
