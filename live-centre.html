<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>BOUNDARY — Live Centre</title><link rel="stylesheet" href="./workspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="./workspace-data.js"><\/script></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="./index.html"><span class="brand-mark">B</span><span>BOUNDARY<span class="brand-dot">.</span></span></a><div class="nav-label">WORKSPACE</div><a class="nav-link " href="./overview.html"><span class="ico">◈</span>Overview</a><a class="nav-link " href="./multiplayer-auction.html"><span class="ico">⌂</span>Auction Lobby</a><a class="nav-link " href="./auction-floor.html"><span class="ico">◉</span>Live Auction</a><a class="nav-link " href="./players.html"><span class="ico">♙</span>Player Hub</a><div class="nav-label">FRONT OFFICE</div><a class="nav-link " href="./franchise.html"><span class="ico">♜</span>My Franchise</a><a class="nav-link " href="./analytics.html"><span class="ico">▥</span>Auction Analytics</a><a class="nav-link active" href="./live-centre.html"><span class="ico">◎</span>Live Centre</a><div class="nav-label">PREFERENCES</div><a class="nav-link " href="./settings.html"><span class="ico">⚙</span>Settings</a><div class="sidebar-bottom"><b>BOUNDARY ARENA</b>Independent cricket auction experience<br>Preview workspace · v0.2</div></aside><section class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div class="crumb">BOUNDARY <span style="color:#52647e">/</span> <b>LIVE CENTRE</b></div></div><div class="top-actions"><span class="online"><i></i> WORKSPACE READY</span><div class="avatar">B</div></div></header><main class="content"><div class="panel" id="liveWorkspacePanel" style="margin:0 0 18px"><div class="panel-head"><div><h2>Connected live broadcast</h2><p>Current lot, highest bid and recent auction activity from the active room.</p></div><span class="status-pill gold" id="liveConnectionStatus">CHECKING CONNECTION</span></div><div id="liveWorkspace" class="empty-note">Loading room data…</div><div style="padding:0 21px 17px;color:var(--muted);font-size:9px" id="liveConnectionHelp"></div></div><div class="page-head"><div><div class="eyebrow">THE FRONT OFFICE / LIVE CENTRE</div><h1>Live Centre</h1><p>A broadcast-style spectator destination for the room pulse, auction ticker and key moments.</p></div></div><section class="hero-panel"><div class="eyebrow">BOUNDARY BROADCAST NETWORK</div><h2>THE AUCTION, <span class="gold-text">IN FOCUS.</span></h2><p>Follow the room without the complexity of bidder controls. This page is designed as the spectator and broadcast layer for live auctions.</p><a class="btn gold" href="./multiplayer-auction.html">Open multiplayer room ↗</a></section><div class="grid split" style="margin-top:16px"><section class="panel"><div class="panel-head"><div><h2>Live auction ticker</h2><p>Recent room events will stream here</p></div><span class="status-pill">AWAITING FEED</span></div><div class="empty-note">No live auction events yet. Connect to an active room to populate the broadcast ticker.</div></section><section class="panel"><div class="panel-head"><div><h2>Matchday broadcast</h2><p>Room-wide context</p></div></div><div class="activity"><div class="activity-row"><div>Current lot<small>Waiting for auctioneer</small></div><span class="activity-amount">—</span></div><div class="activity-row"><div>Leading franchise<small>No active bid</small></div><span class="activity-amount">—</span></div><div class="activity-row"><div>Room pulse<small>No live connection</small></div><span class="status-pill gold">STANDBY</span></div></div></section></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Broadcast features</h2><p>Designed as a separate viewing experience</p></div></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="franchise-card"><h3>Live ticker</h3><p>Every bid, pass and sale in a clean chronological feed.</p></div><div class="franchise-card"><h3>Player spotlight</h3><p>Full-screen player entrance and profile presentation.</p></div><div class="franchise-card"><h3>Sale moments</h3><p>Cinematic SOLD presentation with sound and voice.</p></div></div></div></main></section></div><script>
document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refreshLive(r){const active=r.lots.find(x=>x.status==='active'),bids=r.bids||[],latest=bids.slice(0,12),lead=active?.leading_franchise_id?r.franchises.find(f=>f.id===active.leading_franchise_id):null;document.getElementById('liveWorkspace').innerHTML='<section class="hero-panel"><div class="eyebrow">'+(active?'LOT '+String(active.lot_no).padStart(3,'0')+' · LIVE NOW':'ROOM STATUS · '+r.status.toUpperCase())+'</div><h2>'+(active?esc(active.player_name):'The auction floor is waiting.')+'</h2><p>'+(active?esc(active.player_role)+' · '+esc(active.country):'The auctioneer has not called an active player lot.')+'</p><div style="font:800 clamp(28px,4vw,42px) Manrope;color:var(--gold2);margin:12px 0">₹'+(active?Number(active.current_price).toFixed(2):'—')+' Cr</div><span class="status-pill '+(active?'positive':'gold')+'">'+(active?'LIVE LOT':'NO ACTIVE LOT')+'</span></section><div class="grid stats"><article class="stat-card"><div class="stat-top">FRANCHISES</div><div class="stat-value">'+r.franchises.length+'</div><div class="stat-note">Seats in this room</div></article><article class="stat-card"><div class="stat-top">LOTS PROCESSED</div><div class="stat-value">'+r.lots.length+'</div><div class="stat-note">Sold, unsold and active</div></article><article class="stat-card"><div class="stat-top">TOTAL BIDS</div><div class="stat-value">'+bids.length+'</div><div class="stat-note">Recorded bid events</div></article><article class="stat-card"><div class="stat-top">CURRENT LEADER</div><div class="stat-value" style="font-size:16px">'+(lead?esc(lead.name):'—')+'</div><div class="stat-note">Highest bidder on active lot</div></article></div><div class="panel"><div class="panel-head"><div><h2>Live bid tape</h2><p>Most recent bid records</p></div><span class="status-pill positive">ROOM FEED</span></div>'+(latest.length?'<div class="activity">'+latest.map(b=>{const f=r.franchises.find(x=>x.id===b.franchise_id);const lot=r.lots.find(x=>x.id===b.lot_id);return '<div class="activity-row"><div>'+esc(f?.name||'Franchise')+'<small>'+esc(lot?.player_name||'Player lot')+' · '+new Date(b.created_at).toLocaleTimeString()+'</small></div><span class="activity-amount">₹'+Number(b.amount).toFixed(2)+' Cr</span></div>'}).join('')+'</div>':'<div class="empty-note">No bids have been recorded in this room yet.</div>')+'</div>';}
(async()=>{const badge=document.getElementById('liveConnectionStatus'),box=document.getElementById('liveWorkspace'),help=document.getElementById('liveConnectionHelp');try{const c=await window.BoundaryData.connect();if(!c.ok){badge.textContent='NOT CONNECTED';box.textContent=c.reason;help.innerHTML='Open <a href="./multiplayer-auction.html">Auction Lobby</a> to connect and create or join a room.';return}await refreshLive(c.room);badge.textContent='LIVE ROOM DATA';badge.className='status-pill positive';help.textContent='Room '+c.room.room_code+' · updates automatically when room records change.';await window.BoundaryData.watch(c,async r=>{await refreshLive(r);badge.textContent='LIVE ROOM DATA'})}catch(e){badge.textContent='CONNECTION ERROR';badge.className='status-pill gold';box.textContent=e.message||'Could not load room data.';help.innerHTML='Check your guest session, room membership and Supabase configuration in <a href="./multiplayer-auction.html">Auction Lobby</a>.'}})();
</script></body></html>
