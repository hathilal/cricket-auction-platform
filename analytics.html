<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>BOUNDARY — Auction Analytics</title><link rel="stylesheet" href="./workspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="./workspace-data.js"><\/script></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="./index.html"><span class="brand-mark">B</span><span>BOUNDARY<span class="brand-dot">.</span></span></a><div class="nav-label">WORKSPACE</div><a class="nav-link " href="./overview.html"><span class="ico">◈</span>Overview</a><a class="nav-link " href="./multiplayer-auction.html"><span class="ico">⌂</span>Auction Lobby</a><a class="nav-link " href="./auction-floor.html"><span class="ico">◉</span>Live Auction</a><a class="nav-link " href="./players.html"><span class="ico">♙</span>Player Hub</a><div class="nav-label">FRONT OFFICE</div><a class="nav-link " href="./franchise.html"><span class="ico">♜</span>My Franchise</a><a class="nav-link active" href="./analytics.html"><span class="ico">▥</span>Auction Analytics</a><a class="nav-link " href="./live-centre.html"><span class="ico">◎</span>Live Centre</a><div class="nav-label">PREFERENCES</div><a class="nav-link " href="./settings.html"><span class="ico">⚙</span>Settings</a><div class="sidebar-bottom"><b>BOUNDARY ARENA</b>Independent cricket auction experience<br>Preview workspace · v0.2</div></aside><section class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div class="crumb">BOUNDARY <span style="color:#52647e">/</span> <b>AUCTION ANALYTICS</b></div></div><div class="top-actions"><span class="online"><i></i> WORKSPACE READY</span><div class="avatar">B</div></div></header><main class="content"><div class="panel" id="liveWorkspacePanel" style="margin:0 0 18px"><div class="panel-head"><div><h2>Connected room analytics</h2><p>Metrics are calculated from sold lots and bid records in your active room.</p></div><span class="status-pill gold" id="liveConnectionStatus">CHECKING CONNECTION</span></div><div id="liveWorkspace" class="empty-note">Loading room data…</div><div style="padding:0 21px 17px;color:var(--muted);font-size:9px" id="liveConnectionHelp"></div></div><div class="page-head"><div><div class="eyebrow">THE FRONT OFFICE / AUCTION ANALYTICS</div><h1>Auction Analytics</h1><p>A separate intelligence room for spending patterns, squad value and auction performance.</p></div></div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h2>Performance snapshot</h2><p>Illustrative values only — live metrics will populate when auction data is connected.</p></div><span class="status-pill gold">DEMO MODEL</span></div><div class="grid stats" style="margin:0"><article class="stat-card"><div class="stat-top">TOTAL SPEND</div><div class="stat-value">₹ 0 Cr</div><div class="stat-note">No completed purchases</div></article><article class="stat-card"><div class="stat-top">PLAYERS ACQUIRED</div><div class="stat-value">0</div><div class="stat-note">Across this franchise</div></article><article class="stat-card"><div class="stat-top">Purse remaining</div><div class="stat-value">100%</div><div class="stat-note">Opening purse intact</div></article><article class="stat-card"><div class="stat-top">AVG. PLAYER PRICE</div><div class="stat-value">—</div><div class="stat-note">Awaiting auction results</div></article></div></div><div class="grid split"><section class="panel"><div class="panel-head"><div><h2>Spending allocation</h2><p>Target allocation by squad role</p></div></div><div class="bars"><div class="bar-row"><span>Top order</span><div class="bar"><span style="width:75%"></span></div><b>30%</b></div><div class="bar-row"><span>All-rounders</span><div class="bar"><span style="width:55%"></span></div><b>22%</b></div><div class="bar-row"><span>Fast bowlers</span><div class="bar"><span style="width:65%"></span></div><b>26%</b></div><div class="bar-row"><span>Spin / WK</span><div class="bar"><span style="width:55%"></span></div><b>22%</b></div></div><p style="font-size:9px;color:var(--muted);margin-top:17px">Planning illustration, not calculated from actual auction transactions.</p></section><section class="panel"><div class="panel-head"><div><h2>Intelligence desk</h2><p>Insights to unlock in connected auctions</p></div></div><div class="activity"><div class="activity-row"><div>Value buys<small>Compare final price against player benchmarks</small></div><span class="status-pill blue">PLANNED</span></div><div class="activity-row"><div>Rival spend tracking<small>See remaining purse across franchises</small></div><span class="status-pill blue">PLANNED</span></div><div class="activity-row"><div>Role scarcity alerts<small>Identify positions with limited supply</small></div><span class="status-pill blue">PLANNED</span></div></div></section></div></main></section></div><script>
document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refreshLive(r){const sold=r.lots.filter(x=>x.status==='sold'),spend=sold.reduce((a,x)=>a+Number(x.current_price),0),bids=r.bids||[],avg=sold.length?spend/sold.length:0;const roles={Batter:0,Bowler:0,'All-rounder':0,Wicketkeeper:0};sold.forEach(x=>{const k=Object.keys(roles).find(k=>x.player_role.toLowerCase().includes(k.toLowerCase()));if(k)roles[k]++});const max=Math.max(1,...Object.values(roles));document.getElementById('liveWorkspace').innerHTML='<div class="grid stats" style="margin:0"><article class="stat-card"><div class="stat-top">ROOM SPEND</div><div class="stat-value">₹'+spend.toFixed(2)+' Cr</div><div class="stat-note">Across '+sold.length+' sold lots</div></article><article class="stat-card"><div class="stat-top">PLAYERS SOLD</div><div class="stat-value">'+sold.length+'</div><div class="stat-note">'+r.lots.filter(x=>x.status==='unsold').length+' unsold lots</div></article><article class="stat-card"><div class="stat-top">AVERAGE SALE</div><div class="stat-value">₹'+avg.toFixed(2)+' Cr</div><div class="stat-note">Per completed sale</div></article><article class="stat-card"><div class="stat-top">BIDS RECORDED</div><div class="stat-value">'+bids.length+'</div><div class="stat-note">Across the active room</div></article></div><div class="panel" style="margin-top:15px"><div class="panel-head"><div><h2>Sold players by role</h2><p>Calculated from confirmed sale records</p></div><span class="status-pill positive">LIVE ROOM DATA</span></div><div class="bars">'+Object.entries(roles).map(([k,v])=>'<div class="bar-row"><span>'+k+'</span><div class="bar"><span style="width:'+(v/max*100)+'%"></span></div><b>'+v+'</b></div>').join('')+'</div></div><div class="panel" style="margin-top:15px"><div class="panel-head"><div><h2>Franchise purse table</h2><p>Remaining budget and squad size</p></div></div><div class="table-wrap"><table><thead><tr><th>FRANCHISE</th><th>REMAINING PURSE</th><th>SQUAD</th><th>SPENT</th></tr></thead><tbody>'+r.franchises.map(f=>'<tr><td>'+esc(f.name)+'</td><td>₹'+Number(f.purse??r.starting_purse).toFixed(2)+' Cr</td><td>'+Number(f.squad_count||0)+'</td><td>₹'+(Number(r.starting_purse)-Number(f.purse??r.starting_purse)).toFixed(2)+' Cr</td></tr>').join('')+'</tbody></table></div></div>';}
(async()=>{const badge=document.getElementById('liveConnectionStatus'),box=document.getElementById('liveWorkspace'),help=document.getElementById('liveConnectionHelp');try{const c=await window.BoundaryData.connect();if(!c.ok){badge.textContent='NOT CONNECTED';box.textContent=c.reason;help.innerHTML='Open <a href="./multiplayer-auction.html">Auction Lobby</a> to connect and create or join a room.';return}await refreshLive(c.room);badge.textContent='LIVE ROOM DATA';badge.className='status-pill positive';help.textContent='Room '+c.room.room_code+' · updates automatically when room records change.';await window.BoundaryData.watch(c,async r=>{await refreshLive(r);badge.textContent='LIVE ROOM DATA'})}catch(e){badge.textContent='CONNECTION ERROR';badge.className='status-pill gold';box.textContent=e.message||'Could not load room data.';help.innerHTML='Check your guest session, room membership and Supabase configuration in <a href="./multiplayer-auction.html">Auction Lobby</a>.'}})();
</script></body></html>
